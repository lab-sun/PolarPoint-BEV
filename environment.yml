# Python 3.7 matches the CARLA 0.9.10.1 egg (carla-0.9.10-py3.7-linux-x86_64.egg).
# CARLA is not a pip package. leaderboard/scripts/run_evaluation.sh adds the egg to PYTHONPATH.
# Direct imports only. gym==0.17.3 (stable-baselines3 1.4.0 allows >=0.17,<0.20).
# wandb==0.16.6: 0.13.5 depends on pathtools 0.1.2, whose setup.py imports removed stdlib imp.
name: PolarPoint-BEV
channels:
  - defaults
dependencies:
  - python=3.7
  - pip
  - pip:
      - "--extra-index-url https://download.pytorch.org/whl/cu113"
      - torch==1.10.1+cu113
      - torchvision==0.11.2+cu113
      - numpy==1.21.6
      - pytorch-lightning==1.5.10
      - opencv-python==4.5.5.64
      - Pillow==9.5.0
      - imgaug==0.4.0
      - scikit-learn==1.0.2
      - omegaconf==2.1.2
      - hydra-core==1.1.2
      - h5py==3.7.0
      - gym==0.17.3
      - stable-baselines3==1.4.0
      - wandb==0.16.6
      - shapely==1.7.1
      - py-trees==0.8.3
      - pygame==2.0.3
      - xmlschema==1.0.18
      - ephem==4.1.3
      - tabulate==0.8.10
      - dictor==0.1.7
      - matplotlib==3.5.3
      - six==1.16.0
      - requests==2.28.2
      - tqdm==4.64.1
      - lxml==4.9.3
      - simplejson==3.19.3
